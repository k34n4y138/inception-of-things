apiVersion: apps/v1
kind: Deployment
metadata:
  name: will-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: will-server
  template:
    metadata:
      labels:
        app: will-server
    spec:
      containers:
      - name: will
        image: wil42/playground:v1
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: will-server
spec:
  selector:
    app: will-server
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
  type: LoadBalancer
